services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: examsapp
      POSTGRES_PASSWORD: examsapp
      POSTGRES_DB: examsapp
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, only against a fresh (empty) volume
      - ./server/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examsapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://examsapp:examsapp@db:5432/examsapp
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      CLIENT_ORIGIN: http://localhost:8080
      PORT: 3002
      # Optional — enables POST /api/questions/generate. Pass through from the host shell
      # (export GEMINI_API_KEY=... before `docker compose up`) to use it here.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3002:3002"

  client:
    build: ./client
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  db-data:
